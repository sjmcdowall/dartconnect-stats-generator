# Manual gender overrides for players whose DartConnect M/F is blank.
#
# Gender precedence (src/data_processor.py::_resolve_player_gender):
#   1. League portal Players roster (data/<season>/players_roster.csv,
#      refreshed weekly by scripts/fetch_roster.py)
#   2. Non-blank M/F in the by-leg export
#   3. THIS FILE - used ONLY when 1 and 2 are both blank for the player.
#      DartConnect always wins; when it has a value the override is ignored
#      and scripts/sanity_check.py lists it as a warning.
#   (First-name inference was removed; a player with no gender from 1-3
#    hard-fails the sanity check.)
#
# Keys:
#   by_email:     lower-cased DartConnect email -> M or F (preferred)
#   by_team_name: for players with no email; "Team|Player Name" -> M or F
#                 (Player Name as shown in reports, e.g. "Jane Doe")
#
# Source: Steve McDowall, 2026-10-24. As of the 2026-10-24 roster all three
# are also set in the Players roster (same values), so these are fallback only.

by_email:
  ginger@engageslp.com: F      # Ginger Cahoon (One More Shot)
  waynedugg@icloud.com: M      # Wayne Duggins (KBTN)
  tatum@legnasoftware.com: M   # Tatum Brown (Magic City Sundays) - by-leg export blank on all 23 rows

by_team_name: {}
